worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 512m;
  server {
    listen 8080;
    absolute_redirect off;
    server_name _;
    root /usr/share/nginx/html;
    location = / { return 302 /ui/$is_args$args; }
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location = /release.json { add_header Cache-Control "no-store"; try_files $uri =404; }
    location = /ui { return 302 /ui/$is_args$args; }
    location /ui/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /ui/ { add_header Cache-Control "no-store"; try_files $uri $uri/ /ui/index.html; }
    location /api/studio/ {
      proxy_pass http://runtime:8000;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      add_header Cache-Control "no-store";
    }
    location / { return 404; }
  }
}
